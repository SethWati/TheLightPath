<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheLightPath | Begin your path</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-grad: radial-gradient(ellipse at top, #fffbef 0%, #f4f1ec 55%, #e9e3d8 100%);
            --text: #2c3e50; --muted: #6c757d; --card-bg: #ffffff;
            --header-bg: #2c3e50; --accent: #f6b73c;
        }
        body.dark-mode {
            --bg-grad: radial-gradient(ellipse at top, #1a1c22 0%, #0f1115 60%, #07080b 100%);
            --text: #e0e0e0; --muted: #aaa; --card-bg: #1c1f25;
            --header-bg: #11141a; --accent: #ffd370;
        }
        body { margin: 0; min-height: 100vh; background: var(--bg-grad); color: var(--text);
               display: flex; align-items: center; justify-content: center; padding: 20px;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               transition: background 0.4s, color 0.4s; }
        .theme-toggle { position: fixed; top: 16px; right: 16px;
               background: rgba(255,255,255,0.7); backdrop-filter: blur(6px);
               border: 1px solid rgba(0,0,0,0.08); color: var(--text);
               border-radius: 999px; padding: 6px 14px; font-size: 0.85rem;
               cursor: pointer; transition: transform 0.2s, background 0.3s; }
        body.dark-mode .theme-toggle { background: rgba(30,30,30,0.7); border-color: rgba(255,255,255,0.08); }
        .theme-toggle:hover { transform: scale(1.05); }

        .auth-card { width: 100%; max-width: 460px; background: var(--card-bg);
               box-shadow: 0 20px 60px rgba(0,0,0,0.12); border: none;
               border-radius: 16px; overflow: hidden;
               animation: lp-rise 0.6s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes lp-rise { from { opacity: 0; transform: translateY(20px); }
                             to   { opacity: 1; transform: translateY(0); } }
        .auth-header { background: linear-gradient(135deg, var(--header-bg) 0%, #1a252f 100%);
               color: white; padding: 32px 24px 24px; text-align: center;
               position: relative; overflow: hidden; }
        .auth-header::after { content: ""; position: absolute; inset: 0;
               background: radial-gradient(circle at 20% 0%, rgba(246, 183, 60, 0.18), transparent 40%),
                          radial-gradient(circle at 80% 100%, rgba(246, 183, 60, 0.10), transparent 50%);
               pointer-events: none; }
        .auth-header h2 { margin: 0 0 4px; position: relative; z-index: 1; font-weight: 700; }
        .auth-header .tagline { position: relative; z-index: 1; font-style: italic;
               font-size: 0.95rem; opacity: 0.85; margin: 0; }
        .auth-body { padding: 28px 28px 32px; }
        .form-control-lg { background: transparent; border: 1.5px solid rgba(0,0,0,0.08);
               transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
               color: var(--text); }
        body.dark-mode .form-control-lg { border-color: rgba(255,255,255,0.12);
               background: rgba(255,255,255,0.03); }
        .form-control-lg:focus { border-color: var(--accent);
               box-shadow: 0 0 0 3px rgba(246, 183, 60, 0.18); background: var(--card-bg); }
        .form-label { color: var(--muted); }
        .btn-light-path { background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
               border: none; color: white; font-weight: 700; border-radius: 10px;
               padding: 12px; position: relative; overflow: hidden;
               transition: transform 0.2s ease, box-shadow 0.3s ease; }
        .btn-light-path:hover { transform: translateY(-1px);
               box-shadow: 0 10px 24px rgba(44, 62, 80, 0.35); color: white; }
        .btn-light-path::before { content: ""; position: absolute; inset: 0;
               background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%),
                   rgba(246, 183, 60, 0.35), transparent 60%);
               opacity: 0; transition: opacity 0.25s; }
        .btn-light-path:hover::before { opacity: 1; }
        .auth-footer { font-size: 0.85rem; color: var(--muted); text-align: center; margin-top: 18px; }
        .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        .alert-friendly { background: rgba(220, 53, 69, 0.08);
               border: 1px solid rgba(220, 53, 69, 0.25); color: #b02a37;
               border-radius: 10px; padding: 10px 14px; text-align: center;
               font-size: 0.9rem; }
        body.dark-mode .alert-friendly { background: rgba(220, 53, 69, 0.12); color: #ff8a93; }
    </style>
</head>
<body>

<button id="themeToggle" class="theme-toggle" type="button">🌙 Dark</button>

<div class="auth-card">
    <div class="auth-header">
        <h2>Begin your path</h2>
        <p class="tagline">A few details and you&rsquo;re lit up.</p>
    </div>
    <div class="auth-body">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert-friendly mb-3" role="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold">Choose a username</label>
                <input type="text" class="form-control form-control-lg" id="username" name="username" required autofocus minlength="3" autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-bold">Create a password</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" required minlength="6" autocomplete="new-password">
            </div>
            <div class="mb-4">
                <label for="confirm" class="form-label fw-bold">Confirm password</label>
                <input type="password" class="form-control form-control-lg" id="confirm" name="confirm" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-light-path btn-lg w-100">Light my path &rarr;</button>
        </form>

        <p class="auth-footer mb-0">Already walking with us? <a href="/login">Sign in</a></p>
    </div>
</div>

<script>
    const btn = document.getElementById('themeToggle');
    function setDark(d) { document.body.classList.toggle('dark-mode', d);
        btn.textContent = d ? '☀️ Light' : '🌙 Dark';
        localStorage.setItem('theme', d ? 'dark' : 'light'); }
    if (localStorage.getItem('theme') === 'dark') setDark(true);
    btn.addEventListener('click', () => setDark(!document.body.classList.contains('dark-mode')));
    const submitBtn = document.querySelector('.btn-light-path');
    submitBtn.addEventListener('pointermove', (e) => {
        const r = submitBtn.getBoundingClientRect();
        submitBtn.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
        submitBtn.style.setProperty('--my', ((e.clientY - r.top)  / r.height * 100) + '%');
    });
</script>
</body>
</html>
